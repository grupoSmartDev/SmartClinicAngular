<!-- Menu mobile para telas pequenas -->
<app-menu-mobile></app-menu-mobile>
<div class="d-flex">
  <!-- Sidebar para telas grandes -->
  <app-side-bar class="d-none d-md-block"></app-side-bar>
    <!-- Main content -->
    <div class="main">
      <!-- Header -->
      <app-header></app-header>
  
      <app-body>
        <div class="tabs-container">
          <ul class="nav nav-tabs">
            <li class="nav-item" *ngFor="let tab of tabService.tabs; let i = index">
              <a  class="nav-link"
              [class.active]="tabService.activeTab === i"
              [ngClass]="{
                'bg-success-aba': tabService.activeTab === i,
                'text-white': tabService.activeTab === i,
                'text-success': tabService.activeTab !== i
              }"
              (click)="tabService.selectTab(i)"
              href="javascript:void(0)"
            >
                {{ tab.title }}
                <button
                  type="button"
                  class="btn-close"
                  [class.text-white]="tabService.activeTab === i"
                  (click)="$event.stopPropagation(); closeTab(i)"
                ></button>
              </a>
            </li>
          </ul>
        
          <div class="mt-3 card p-3">
            <router-outlet></router-outlet>
          </div>
        </div>
      </app-body>
      
    </div>
  </div>
