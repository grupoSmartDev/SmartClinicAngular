<div class="row">
    <app-label-nome [nomeTela]="'Tipo de Pagamento'" (adicionarClicked)="openModal('')"></app-label-nome>
  </div>

  <div class="row mb-2">  
    <div class="col-md-2">
      <input type="text"
       [(ngModel)]="idFiltro" 
       placeholder="Filtrar por Cód"
       class="form-control form-control-sm" />
    </div>
    
    <div class="col-md-2">
      <input type="text"
       [(ngModel)]="descricaoFiltro" 
       placeholder="Filtrar por descrição"
       class="form-control form-control-sm" />
    </div>
  
    <div class="col-md-1">
      <button class="btn btn-secondary btn-sm" (click)="filtrar()"><i class="bi bi-search"></i></button>
    </div>
  </div>

  <div class="row mb-2">
    <div class="col-12">
      @if (lista.length > 0) {
      <div class="table-responsive">
        <table class="table table-striped table-centered mb-0">
          <thead>
            <tr>
              <th>Cód.</th>
              <th>Descrição</th>
              <th class="text-end"></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of lista">
              <!-- Renderiza dinamicamente as células com base nas colunas -->
              <td>
                {{ item.id }}
              </td>
              <td>
                {{ item.descricao }}
              </td>

              <td class="text-end">
                <a
                  href="javascript:void(0);"
                  (click)="openModal(item)"
                  class="action-icon btn-tooltip"
                >
                  <i class="bi bi-pencil text-warning"></i>
                  <span class="tooltip-text">Edição rapida</span>
                </a>
                <a
                  href="javascript:void(0);"
                  (click)="promptDelete(item)"
                  class="action-icon btn-tooltip"
                >
                  <i class="bi bi-trash3 text-danger"></i>
                  <span class="tooltip-text">Excluir</span>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      } @else {
      <div class="alert alert-danger" role="alert">
        Nenhum registro encontrado
      </div>
      <img src="public\image\semRegistro.svg" alt="" />
      }
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="">
      <pagination
        [totalItems]="totalItems"
        [(ngModel)]="currentPage"
        [itemsPerPage]="pageSize"
        (pageChanged)="onPageChange($event.page)"
        previousText="&lsaquo;"
        nextText="&rsaquo;" 
        firstText="&laquo;" 
        lastText="&raquo;">
    </pagination>
    </div>
  </div>



  <app-modal-tipo-pagamento (tipoDePagamentoAtualizado)="atualizarLista()"></app-modal-tipo-pagamento>

  <app-confirm-dialog
  #confirmDialog
  (onConfirm)="confirmDelete()"
  (onCancel)="cancelDelete()">
</app-confirm-dialog>
