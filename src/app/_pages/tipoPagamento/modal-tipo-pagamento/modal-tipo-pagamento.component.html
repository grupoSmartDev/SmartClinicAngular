  <!-- Modal -->
  <div #modalTipoPagamento class="modal fade" id="modaltipoPagamento" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="statusModalLabel" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Tipo de Pagamento</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form [formGroup]="formulario">
            <div class="row g-3">
              <div class="col-md-2">
                  <label for="Id" class="form-label">Cód.</label>
                  <input type="text" class="form-control form-control-sm" id="Id" readonly formControlName="id" />
              </div>
              <div class="col-md-10">
                <label for="descricao" class="form-label">Descrição</label>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  id="descricao"
                  formControlName="descricao"
                  [ngClass]="{ 'is-invalid': formulario.get('descricao')?.invalid && formulario.get('descricao')?.touched }"
                />
                <div 
                *ngIf="formulario.get('descricao')?.invalid
                 && formulario.get('descricao')?.touched"
                 class="invalid-feedback">
                  O campo descrição é obrigatório.
                </div>
                </div>
          </div>
          </form>
        </div>
        <div class="modal-footer">
            <button type="button"  (click)="onSubmit()" class="btn btn-success" id="btn_salvar_editar"><i class="bi bi-check"></i> Confirmar</button>
            <button type="button" class="btn btn-danger" id="btnCancelar" data-bs-dismiss="modal" aria-label="Close" (click)="fecharModal()"><i class="bi bi-x"></i>Cancelar</button>
        </div>
      </div>
    </div>
  </div>
