
  <app-label-nome [nomeTela]="'Status'"></app-label-nome>


<div class="row">
  <div class="col-12">
    <div class="">
      <div class="card-body">
        <div class="row mb-2">
          <div class="col-sm-5">
          </div>
          <div class="col-sm-7">
            <div class="text-sm-end">
              
            </div>
          </div>
          <!-- end col-->
        </div>

        <div class="row">
          <div class="col-12">
            @if (statusList.length > 0) {
              <table class="table table-striped table-centered mb-0">
                <thead>
                  <tr>
                    <th>Cód.</th>
                    <th>Status</th>
                    <th>Cor</th>
                    <th>Legenda</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  @for (status of statusList; track $index) {
                  <tr>
                    <td>{{ status.id }}</td>
                    <td>{{ status.status }}</td>
                    <td>
                      <input
                        type="color"
                        readonly
                        disabled="true"
                        value="{{ status.cor }}"
                      />
                    </td>
                    <td>{{ status.legenda }}</td>
                    <td class="text-end">
                      <a
                        href="javascript: void(0);"
                        (click)="openModal(status)"
                        class="action-icon"
                      >
                        <i class="bi bi-pencil text-success"></i
                      ></a>
                      <a
                        href="javascript: void(0);"
                        (click)="promptDelete(status.id ?? '')"
                        class="action-icon"
                      >
                        <i class="bi bi-trash3 text-danger"></i
                      ></a>
                    </td>
                  </tr>
                  }
                </tbody>
              </table>
            }
            @else {
              <div class="alert alert-danger" role="alert">
                Nenhum registro encontrado
              </div>
              <img src="public\image\semRegistro.svg" alt="">
            }
          
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- listar.component.html -->
<app-modal-status (statusAtualizado)="atualizarLista()"></app-modal-status>

<app-confirm-dialog
  #confirmDialog
  (onConfirm)="confirmDelete()"
  (onCancel)="cancelDelete()"
></app-confirm-dialog>
