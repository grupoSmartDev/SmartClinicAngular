<!-- Modal -->
<div
  #modalConvenio
  class="modal fade"
  id="modalConvenio"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  tabindex="-1"
  aria-labelledby="statusModalLabel"
  aria-modal="true"
  role="dialog"
>
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Convênio</h1>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="formulario">
          <div class="row g-3">
            <div class="col-md-2">
              <label for="id" class="form-label">Cód.</label>
              <input
                type="text"
                class="form-control form-control-sm"
                id="Id"
                readonly
                formControlName="id"
              />
            </div>
            <div class="col-md-3">
              <label for="nome" class="form-label">Nome</label>
              <input
                type="text"
                required
                class="form-control form-control-sm required"
                formControlName="nome"
              />
            </div>
            <div class="col-md-3">
              <label for="registroAvs" class="form-label">Registro Avs</label>
              <input
                type="text"
                required
                class="form-control form-control-sm"
                formControlName="registroAvs"
              />
            </div>
            <div class="col-md-3">
              <label for="periodoCarencia" class="form-label"
                >Periodo Carência</label
              >
              <input
                type="text"
                required
                class="form-control form-control-sm"
                formControlName="periodoCarencia"
                [mask]="'00/00/0000'"
              />
            </div>
            <div class="col-md-3">
              <label for="telefone" class="form-label">Telefone</label>
              <input
                type="text"
                required
                class="form-control form-control-sm"
                formControlName="telefone"
                [mask]="'(00) 0000-0000'"
              />
            </div>
            <div class="col-md-3">
              <label for="email" class="form-label">E-mail</label>
              <input
                type="text"
                required
                class="form-control form-control-sm"
                formControlName="email"
              />
            </div>
            <div class="col-md-3">
             
              <div class="form-check form-switch">
                <label class="form-check-label" for="ativo">Ativo</label>
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="ativo"
                  formControlName="ativo"
                />
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          (click)="onSubmit()"
          class="btn btn-success"
          id="btn_salvar_editar"
        >
          <i class="bi bi-check"></i> Confirmar
        </button>
        <button
          type="button"
          class="btn btn-danger"
          id="btnCancelar"
          data-bs-dismiss="modal"
          aria-label="Close"
          (click)="fecharModal()"
        >
          <i class="bi bi-x"></i>Cancelar
        </button>
      </div>
    </div>
  </div>
</div>
