<div class="row">
  <app-label-nome
    [nomeTela]="'Fornecedores'"
    (adicionarClicked)="openModal('')"
  ></app-label-nome>
</div>



<div class="card mb-3">
  <div class="card-header bg-light d-flex justify-content-between align-items-center" 
       (click)="toggleFiltros()" 
       style="cursor: pointer;">
    <h6 class="mb-0"><i class="bi bi-funnel"></i> Filtros de Pesquisa</h6>
    <button class="btn btn-sm btn-link text-dark p-0">
      <i class="bi" [ngClass]="mostrarFiltros ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
    </button>
  </div>
  <div class="card-body py-3" [ngClass]="{'d-none': !mostrarFiltros}">

    <div class="row mt-3">
      <div class="col-md-12 text-end">
        <button type="button" class="btn btn-sm btn-primary me-2" (click)="onSearch()">
          <i class="bi bi-search me-1"></i> Pesquisar
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="limparFiltros()">
          <i class="bi bi-x-circle me-1"></i> Limpar Filtros
        </button>
      </div>
    </div>

    <!--COLOCAR ABAIXO OS FILTROS-->
    <div class="row mb-3">

      <div class="col-md-2">
        <label for="" class="form-label small fw-bold">Cód.</label>
        <input
          type="text"
          class="form-control form-control-sm"
          placeholder="Filtrar por código"
          [(ngModel)]="idFiltro"
        />
      </div>
    
      <div class="col-md-3">
        <label for="" class="form-label small fw-bold">Nome</label>
        <input
          type="text"
          class="form-control form-control-sm"
          placeholder="Filtrar por nome"
          [(ngModel)]="nomeFiltro"
        />
      </div>
      <div class="col-md-2">
        <label for="" class="form-label small fw-bold">CPF</label>
        <input
          type="text"
          mask="000.000.000-00"
          class="form-control form-control-sm"
          placeholder="Filtrar por CPF"
          [(ngModel)]="cpfFiltro"
        />
      </div>
      <div class="col-md-2">
        <label for="" class="form-label small fw-bold">CNPJ</label>
        <input
          type="text"
          class="form-control form-control-sm"
          placeholder="Filtrar por CNPJ"
          [(ngModel)]="cnpjFiltro"
        />
      </div>
    
      <div class="col-md-2">
        <label for="" class="form-label small fw-bold">Celular</label>
        <input
          type="text"
          class="form-control form-control-sm"
          placeholder="Filtrar por celular"
          mask="(00) 00000-0000"
          [(ngModel)]="celularFiltro"
        />
      </div>

    </div>
  </div>
</div>

<div class="row">
  <div class="col-12">
    @if (lista.length > 0) {
    <div class="table-responsive">
      <table class="table table-striped table-centered mb-0">
        <thead>
          <tr>
            <th>Cód.</th>
            <th>Nome</th>
            <th>Celular</th>
            <th class="text-end"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of lista">
            <!-- Renderiza dinamicamente as células com base nas colunas -->
            <td>
              {{ item.id }}
            </td>
            <td>
              {{ item.tipo == 'F' ? item.nome : item.fantasia }}
            </td>
            <td>
              {{ item.celular }} 
            </td>
            <td class="text-end">
              <a
                href="javascript:void(0);"
                (click)="openModal(item)"
                class="action-icon btn-tooltip"
              >
                <i class="bi bi-pencil text-warning"></i>
                <span class="tooltip-text">Edição rapida</span>
              </a>
              <a
                href="javascript:void(0);"
                (click)="promptDelete(item)"
                class="action-icon btn-tooltip"
              >
                <i class="bi bi-trash3 text-danger"></i>
                <span class="tooltip-text">Excluir</span>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    } @else {
    <div class="alert alert-danger" role="alert">
      Nenhum registro encontrado
    </div>
    <img src="public\image\semRegistro.svg" alt="" />
    }

        <!-- Paginação Bootstrap -->
        <div class="row justify-content-center">
          <div class="">
            <pagination
              [totalItems]="totalItems"
              [(ngModel)]="currentPage"
              [itemsPerPage]="pageSize"
              (pageChanged)="onPageChange($event.page)"
              previousText="&lsaquo;"
              nextText="&rsaquo;" 
              firstText="&laquo;" 
              lastText="&raquo;">
          </pagination>
          </div>
        </div>
        
  </div>
</div>



<app-modal-fornecedor
  #modalFornecedor
  (fornecedorAtualizado)="atualizarLista()"
></app-modal-fornecedor>

<app-confirm-dialog
  #confirmDialog
  (onConfirm)="confirmDelete()"
  (onCancel)="cancelDelete()"
></app-confirm-dialog>
