
<!-- Modal -->
<div #modalCriarEditar class="modal fade" id="modalCriarEditar" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="statusModalLabel" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Plano de contas Sub</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form [formGroup]="formulario">
            <div class="row g-3">
              <div class="col-md-2">
                <label for="id" class="form-label">Cód.</label>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  id="id"
                  readonly
                  formControlName="id"
                />
              </div>
              <div class="col-md-3">
                <label for="tipo" class="form-label">Tipo</label>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  id="tipo"
                  formControlName="tipo"
                  [ngClass]="{ 'is-invalid': formulario.get('tipo')?.invalid && formulario.get('tipo')?.touched }"
                />
                <div *ngIf="formulario.get('tipo')?.invalid && formulario.get('tipo')?.touched" class="invalid-feedback">
                  O campo tipo é obrigatório.
                </div>
              </div>
              <div class="col-md-3">
                <label for="codigo" class="form-label">Código</label>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  id="codigo"
                  formControlName="codigo"
                  [ngClass]="{ 'is-invalid': formulario.get('codigo')?.invalid && formulario.get('codigo')?.touched }"
                />
                <div 
                *ngIf="formulario.get('codigo')?.invalid
                 && formulario.get('codigo')?.touched"
                  class="invalid-feedback">
                  O campo codigo é obrigatório.
                </div>
              </div>
              <div class="col-md-4">
                <label for="nome" class="form-label">Nome</label>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  id="nome"
                  formControlName="nome"
                  [ngClass]="{ 'is-invalid': formulario.get('nome')?.invalid && formulario.get('nome')?.touched }"
                />
                <div 
                *ngIf="formulario.get('nome')?.invalid
                 && formulario.get('nome')?.touched"
                  class="invalid-feedback">
                  O campo nome é obrigatório.
                </div>
              </div>
              <!-- 
                adicionar o select de plano de contas pai
                criar no ts o plano de contas pai com o request. 
               -->
               <div class="col-md-3">
                <label for="" class="form-label">Plano de Contas</label>
                <select class="form-select form-select-sm" formControlName="planoContaId">
                    <option value="">Selecione...</option>
                  @for (item of listaPlanoContas; track item.id) {
                    <option value="{{item.id}}">{{item.nome}} - {{item.tipo}}</option>
                  }
                </select>
               </div>
              
            </div>
                
          </form>
          
        </div>
        <div class="modal-footer">
          <button type="button" (click)="onSubmit()" class="btn btn-success"><i class="bi bi-check"></i> Confirmar</button>
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal" (click)="fecharModal()" id="btnCancelar"><i class="bi bi-x"></i> Cancelar</button>
        </div>
      </div>
    </div>
  </div>
