<app-label-nome [nomeTela]="'Banco'"
(adicionarClicked)="openModal('')"
>
</app-label-nome>

<div class="row mb-3">

  <div class="col-md-2">
    <input
      type="text"
      class="form-control form-control-sm"
      placeholder="Filtrar por código"
      [(ngModel)]="idFiltro"
    />
  </div>

  <div class="col-md-3">
    <input
      type="text"
      class="form-control form-control-sm"
      placeholder="Filtrar por nome"
      [(ngModel)]="nomeTitularFiltro"
    />
  </div>
  <div class="col-md-2">
    <input
      type="text"
      class="form-control form-control-sm"
      placeholder="Filtrar por documento do titular"
      [(ngModel)]="documentoTitularFiltro"
    />
  </div>
  <div class="col-md-2">
    <input
      type="text"
      class="form-control form-control-sm"
      placeholder="Filtrar por banco"
      [(ngModel)]="nomeBancoFiltro"
    />
  </div>

 

  <div class="col-md-1">
    <button type="button" class="btn btn-sm btn-secondary" 
    (click)="onSearch()">
      <i class="bi bi-search"></i>
    </button>
  </div>
</div>

<div class="row mb-2">
  <div class="col-12">
    @if (lista.length > 0) {
    <div class="table-responsive">
      <table class="table table-striped table-centered mb-0">
        <thead>
          <tr>
            <th>Cód.</th>
            <th>Banco</th>
            <th>Agência</th>
            <th>N° Conta</th>
            <th>Tipo de Conta</th>
            <th class="text-end"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of lista" [ngStyle]="{'background-color': item.ativo ? 'green' : 'red'}">
            <!-- Renderiza dinamicamente as células com base nas colunas -->
            <td>
              {{ item.id }}
            </td>
            <td>
              {{ item.nomeBanco }}
            </td>
            <td>
              {{ item.agencia }} 
            </td>
            <td>
              {{ item.numeroConta }} 
            </td>
            <td>
              {{ item.tipoConta }} 
            </td>
            <td class="text-end">
              <a
                href="javascript:void(0);"
                (click)="openModal(item)"
                class="action-icon btn-tooltip"
              >
                <i class="bi bi-pencil text-warning"></i>
                <span class="tooltip-text">Edição rapida</span>
              </a>
              <a
                href="javascript:void(0);"
                (click)="promptDelete(item)"
                class="action-icon btn-tooltip"
              >
                <i class="bi bi-trash3 text-danger"></i>
                <span class="tooltip-text">Excluir</span>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    } @else {
    <div class="alert alert-danger" role="alert">
      Nenhum registro encontrado
    </div>
    <img src="public\image\semRegistro.svg" alt="" />
    }
  </div>
</div>

        <!-- Paginação Bootstrap -->
        <div class="row justify-content-center">
          <div class="">
            <pagination
              [totalItems]="totalItems"
              [(ngModel)]="currentPage"
              [itemsPerPage]="pageSize"
              (pageChanged)="onPageChange($event.page)"
              previousText="&lsaquo;"
              nextText="&rsaquo;" 
              firstText="&laquo;" 
              lastText="&raquo;">
          </pagination>
          </div>
        </div>


<app-modal-banco (bancoAtualizado)="atualizarLista()"></app-modal-banco>

<app-confirm-dialog
  #confirmDialog
  (onConfirm)="confirmDelete()"
  (onCancel)="cancelDelete()"
></app-confirm-dialog>
