<app-paciente-completo></app-paciente-completo>

<!-- Modal -->
<div class="" id="addPlanoModal" tabindex="-1" aria-labelledby="addPlanoModalLabel" aria-hidden="true">
    <div class="">
      <div class="">
        <div class="modal-header">
          <h5 class="modal-title" id="addPlanoModalLabel">Adicionar/Editar Plano</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <!-- Descrição do Plano -->
            <div class="mb-3">
              <label for="descricao" class="form-label">Descrição</label>
              <input type="text" class="form-control" id="descricao" placeholder="Digite a descrição">
            </div>
  
            <!-- Valor Base do Plano -->
            <div class="mb-3">
              <label for="valorPlano" class="form-label">Valor Base do Plano</label>
              <input type="number" step="0.01" class="form-control" id="valorPlano" placeholder="Digite o valor do plano">
            </div>
  
            <!-- Planos com valores -->
            <h6 class="mt-4">Planos por Período</h6>
            <div class="form-check d-flex align-items-center mb-3">
              <input type="checkbox" class="form-check-input me-2" id="planoAnual">
              <label class="form-check-label flex-grow-1" for="planoAnual">Plano Anual</label>
              <input type="number" step="0.01" class="form-control w-50" id="valorAnual" placeholder="Valor do Plano Anual">
            </div>
            <div class="form-check d-flex align-items-center mb-3">
              <input type="checkbox" class="form-check-input me-2" id="planoSemestral">
              <label class="form-check-label flex-grow-1" for="planoSemestral">Plano Semestral</label>
              <input type="number" step="0.01" class="form-control w-50" id="valorSemestral" placeholder="Valor do Plano Semestral">
            </div>
            <div class="form-check d-flex align-items-center mb-3">
              <input type="checkbox" class="form-check-input me-2" id="planoTrimestral">
              <label class="form-check-label flex-grow-1" for="planoTrimestral">Plano Trimestral</label>
              <input type="number" step="0.01" class="form-control w-50" id="valorTrimestral" placeholder="Valor do Plano Trimestral">
            </div>
            <div class="form-check d-flex align-items-center mb-3">
              <input type="checkbox" class="form-check-input me-2" id="planoBimestral">
              <label class="form-check-label flex-grow-1" for="planoBimestral">Plano Bimestral</label>
              <input type="number" step="0.01" class="form-control w-50" id="valorBimestral" placeholder="Valor do Plano Bimestral">
            </div>
  
            <!-- Observações ou outros campos -->
            <div class="mb-3">
              <label for="observacoes" class="form-label">Observações</label>
              <textarea class="form-control" id="observacoes" rows="3" placeholder="Adicione observações se necessário"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary">Salvar</button>
        </div>
      </div>
    </div>
  </div>
