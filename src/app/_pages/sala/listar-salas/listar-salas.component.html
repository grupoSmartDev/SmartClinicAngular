<div class="row">
  <app-label-nome [nomeTela]="'Sala'"></app-label-nome>
</div>

<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <div class="row mb-2">
          <div class="col-sm-5">
            <a
              href="javascript:void(0);"
              (click)="openModal('')"
              class="btn btn-danger mb-2"
              ><i class="bi bi-plus me-2"></i>Sala</a
            >
          </div>
          <div class="col-sm-7">
            <div class="text-sm-end">
              <button type="button" class="btn btn-success mb-2 me-1">
                <i class="bi bi-gear"></i>
              </button>
              <button type="button" class="btn btn-light mb-2 me-1">
                Import
              </button>
              <button type="button" class="btn btn-light mb-2">Export</button>
            </div>
          </div>
          <!-- end col-->
        </div>

        <div class="row">
          <div class="col-12">
            @if (listaDeSalas.length > 0) {
            <table class="table table-striped table-centered mb-0">
              <thead>
                <tr>
                  <th>Cód.</th>
                  <th>Status</th>
                  <th>Cor</th>
                  <th>Legenda</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                @for (sala of listaDeSalas; track $index) {
                <tr>
                  <td>{{ sala.id }}</td>
                  <td>{{ sala.nome }}</td>
                  <td>
                    {{ sala.capacidade }}
                  </td>
                  <td class="text-end">
                    <a
                      href="javascript: void(0);"
                      (click)="openModal(sala)"
                      class="action-icon"
                    >
                      <i class="bi bi-pencil text-success"></i
                    ></a>
                    <a
                      href="javascript: void(0);"
                      (click)="promptDelete(sala.id)"
                      class="action-icon"
                    >
                      <i class="bi bi-trash3 text-danger"></i
                    ></a>
                  </td>
                </tr>
                }
              </tbody>
            </table>
            } @else {
            <div class="alert alert-danger" role="alert">
              Nenhum registro encontrado
            </div>
            <img src="public\image\semRegistro.svg" alt="" />
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- listar.component.html -->
<app-modal-salas (statusAtualizado)="atualizarLista()"></app-modal-salas>

<app-confirm-dialog
  #confirmDialog
  (onConfirm)="confirmDelete()"
  (onCancel)="cancelDelete()"
></app-confirm-dialog>
