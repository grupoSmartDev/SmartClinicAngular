<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card w-75 shadow-lg" style="max-width: 900px;">
    <div class="row g-0">
      <!-- Esquerda - Logo e imagens de fundo -->
      <div class="col-lg-5 bg-success text-white d-flex flex-column justify-content-center align-items-center p-4 rounded-start bg-imagem">
        <div class="text-center">
          <img src="/assets/img/logo.png" alt="Logo" class="mb-3" style="max-width: 200px;">
        </div>
      </div>

      <!-- Direita - Formulário de Login -->
      <div class="col-lg-7 p-5 d-flex flex-column justify-content-center">
        <h3 class="mb-4 text-center">Acesse sua conta</h3>
        <form>
          <div class="form-group mb-3">
            <label for="email">E-mail</label>
            <input type="email" id="email" class="form-control rounded-pill">
          </div>
          <div class="form-group mb-4">
            <label for="password">Senha</label>
            <input type="password" id="password" class="form-control rounded-pill">
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-success rounded-pill w-100">Acessar</button>
          </div>
          <div class="d-flex justify-content-between mt-3">
            <a href="#" class="text-muted">Esqueci a senha</a>
            <a href="#" class="text-success">Assine agora</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
