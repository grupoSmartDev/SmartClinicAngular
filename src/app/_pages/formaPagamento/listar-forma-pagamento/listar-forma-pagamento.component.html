<div class="row">
  <app-label-nome [nomeTela]="'Forma de Pagamento'"></app-label-nome>
</div>

<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <div class="row mb-2">
          <div class="col-sm-5">
            <a
              href="javascript:void(0);"
              (click)="openModal('')"
              class="btn btn-danger mb-2"
              ><i class="bi bi-plus me-2"></i>Forma de Pagamento</a
            >
          </div>
          <div class="col-sm-7">
            <div class="text-sm-end">
              <button type="button" class="btn btn-success mb-2 me-1">
                <i class="bi bi-gear"></i>
              </button>
              <button type="button" class="btn btn-light mb-2 me-1">
                Import
              </button>
              <button type="button" class="btn btn-light mb-2">Export</button>
            </div>
          </div>
          <!-- end col-->
        </div>

        <div class="row">
          <div class="col-12">
            <table class="table table-striped table-centered mb-0">
              <thead>
                <tr>
                  <th>Cód.</th>
                  <th>Parcelas</th>
                  <th>Descrição</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                @for (formaPagamento of formaPagamentoLista; track $index) {
                <tr>
                  <td>
                    {{ formaPagamento.id }}
                  </td>
                  <td>
                    {{ formaPagamento.parcelas }}
                  </td>
                  <td>
                    {{ formaPagamento.descricao }}
                  </td>
                  <td class="text-end">
                    <a
                      href="javascript: void(0);"
                      (click)="openModal(formaPagamento)"
                      class="action-icon"
                    >
                      <i class="bi bi-pencil text-success"></i
                    ></a>
                    <a
                      href="javascript: void(0);"
                      (click)="promptDelete(formaPagamento.id ?? '')"
                      class="action-icon"
                    >
                      <i class="bi bi-trash3 text-danger"></i
                    ></a>
                  </td>
                </tr>
                }
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-modal-forma-pagamento (formaPagamentoAtualizado)="atualizarLista()"> </app-modal-forma-pagamento>

<app-confirm-dialog
  #confirmDialog
  (onConfirm)="confirmDelete()"
  (onCancel)="cancelDelete()"
></app-confirm-dialog>
