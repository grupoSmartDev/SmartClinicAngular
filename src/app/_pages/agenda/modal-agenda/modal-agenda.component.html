<div class="modal fade" id="modalAgenda" tabindex="-1" aria-labelledby="modalAgendaLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalAgendaLabel">
            {{ selectedEvent ? 'Detalhes do Evento' : 'Novo Agendamento' }}
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div *ngIf="selectedEvent; else novoAgendamento">
            <p><strong>Evento:</strong> {{ selectedEvent.title }}</p>
            <p><strong>Data:</strong> {{ selectedEvent.date || selectedEvent.start }}</p>
            <p><strong>Horário:</strong> {{ selectedEvent.start || 'Não especificado' }} - {{ selectedEvent.end || 'Não especificado' }}</p>
          </div>
          <ng-template #novoAgendamento>
            <p>Data Selecionada: {{ selectedDate }}</p>
            <form>
              <!-- Campos para criar um novo agendamento -->
              <div class="mb-3">
                <label for="eventTitle" class="form-label">Título</label>
                <input type="text" class="form-control" id="eventTitle" placeholder="Título do agendamento">
              </div>
            </form>
          </ng-template>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
          <button *ngIf="!selectedEvent" type="button" class="btn btn-primary">Salvar</button>
        </div>
      </div>
    </div>
  </div>
