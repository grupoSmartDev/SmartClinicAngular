<form [formGroup]="formDadosUsuario" (ngSubmit)="alterarDadosUsuario()">
  <div class="row">
    <div class="col-md-6 mb-3">
      <label>Nome</label>
      <input type="text" class="form-control" formControlName="firstName" />
    </div>
    <div class="col-md-6 mb-3">
      <label>Sobrenome</label>
      <input type="text" class="form-control" formControlName="lastName" />
    </div>
    <div class="col-md-6 mb-3">
      <label>Email</label>
      <input type="email" class="form-control" formControlName="email" />
    </div>
  </div>

  <hr />
  <h5>Alterar Senha (opcional)</h5>

  <div class="row">
    <div class="col-md-4 mb-3">
      <label>Senha Atual</label>
      <input type="password" class="form-control" formControlName="senhaAtual" />
    </div>
    <div class="col-md-4 mb-3">
      <label>Nova Senha</label>
      <input type="password" class="form-control" formControlName="novaSenha" />
    </div>
    <div class="col-md-4 mb-3">
      <label>Confirmar Nova Senha</label>
      <input type="password" class="form-control" formControlName="confirmarSenha" />
    </div>
  </div>

  <button class="btn btn-success">Salvar Alterações</button>
</form>
