<!-- faq.component.html -->
<section class="faq-section py-5" style="background-color: #edfdf3">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="text-center mb-5">
          <h2 class="display-6 mb-3">
            <i class="bi bi-lightbulb text-success me-2"></i> Ainda tem dúvidas?
          </h2>
        </div>

        <div class="accordion">
          <div class="mb-3" *ngFor="let faq of faqs; let i = index">
            <div class="card border-0 shadow-sm">
              <div
                class="card-header bg-white border-0 px-4 py-3"
                (click)="toggleFaq(faq)"
              >
                <div class="d-flex justify-content-between align-items-center">
                  <h5 class="mb-0 fw-bold">
                    <i class="bi bi-geo-alt-fill text-success me-2"></i>
                    {{ faq.question }}
                  </h5>
                  <i
                    class="bi"
                    [ngClass]="faq.isOpen ? 'bi-chevron-up' : 'bi-chevron-down'"
                  ></i>
                </div>
              </div>
              <div class="card-body px-4 py-3" *ngIf="faq.isOpen">
                <p class="mb-0">{{ faq.answer }}</p>
              </div>
            </div>
          </div>
        </div>

        <div class="text-center mt-5">
          <p class="mb-4">
            <i class="bi bi-diamond-half text-success me-2"></i>
            Junte-se às clínicas que já descobriram o poder da tecnologia na
            gestão de saúde.
          </p>
          <p class="fw-bold">
            <i class="bi bi-megaphone text-success me-2"></i>
            Pare de perder tempo com tarefas operacionais e foque no que
            realmente importa: o cuidado com seus pacientes!
          </p>
          <div class="mt-4">
            <a
              routerLink="/cadastro"
              class="btn btn-success btn-lg rounded-pill px-4 py-2"
            >
              QUERO TESTAR GRÁTIS AGORA
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
