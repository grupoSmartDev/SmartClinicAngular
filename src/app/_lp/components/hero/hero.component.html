<!-- hero.component.html -->
<section
  class="hero-section"
  style="background-color: #edfdf3; padding-top: 8rem"
>
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-12">
        <div
          class="badge bg-white text-success shadow-sm rounded-pill mb-3 py-2 px-3"
        >
          Planos a partir de R$89,90*
        </div>
        <h1 class="display-5 fw-bold mb-4">
          Otimize seu tempo.
          <span class="text-success"
            >Transforme a experiência do seu paciente.
          </span>
          Cresça sua clínica com tecnologia inteligente.
        </h1>

        <div class="mt-5">
          <div class="row g-2">
            <div class="col-md-4">
              <input
                type="text"
                class="form-control form-control-lg rounded-pill"
                placeholder="Insira seu nome"
                [(ngModel)]="Nome"
              />
            </div>
            <div class="col-md-4">
              <input
                type="email"
                class="form-control form-control-lg rounded-pill"
                placeholder="Insira seu email"
                [(ngModel)]="email"
              />
            </div>
            <div class="col-md-4">
              <a
                routerLink="/cadastro"
                class="btn btn-success btn-lg rounded-pill w-100"
              >
                Comece o teste de 7 dias grátis
              </a>
            </div>
          </div>
          <small class="text-muted mt-4 d-block"
            >*valor mensal equivalente na contratação anual</small
          >
        </div>
      </div>

      <div class="col-lg-6 d-none">
        <div class="position-relative">
          <img
            src="assets/images/hero-doctor.jpg"
            class="img-fluid rounded-4 shadow"
            alt="Profissional de saúde"
          />

          <!-- Badges flutuantes -->
          <div
            class="position-absolute badge bg-white shadow rounded-pill p-2 d-flex align-items-center"
            style="top: 30%; left: -5%"
          >
            <span class="badge rounded-circle bg-success me-2"
              ><i class="bi bi-gear"></i
            ></span>
            Sistema de gestão
          </div>

          <div
            class="position-absolute badge bg-white shadow rounded-pill p-2 d-flex align-items-center"
            style="top: 15%; right: 5%"
          >
            <span class="badge rounded-circle bg-success me-2"
              ><i class="bi bi-cash"></i
            ></span>
            Serviços financeiros
          </div>

          <div
            class="position-absolute badge bg-white shadow rounded-pill p-2 d-flex align-items-center"
            style="bottom: 20%; right: 0"
          >
            <span class="badge rounded-circle bg-success me-2"
              ><i class="bi bi-star"></i
            ></span>
            Vantagens exclusivas
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
