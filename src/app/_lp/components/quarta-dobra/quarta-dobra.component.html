<section class="unique-sec pad">
  <div class="wrap">
    <div class="head" lpReveal>
      <h2 class="lp-h2" style="max-width: 20ch">O QUE TORNA A CLINIC SMART ÚNICO?</h2>
    </div>
    <div class="tri">
      @for (benefit of benefits; track benefit.title; let i = $index) {
      <article class="lp-card" lpReveal lpSpot [style.--d]="(i % 3) * .1 + 's'">
        <div class="ico"><svg class="ic"><use [attr.href]="'#' + benefit.icon" /></svg></div>
        <h3>{{ benefit.title }}</h3>
        <p>{{ benefit.description }}</p>
      </article>
      }
    </div>
  </div>
</section>
