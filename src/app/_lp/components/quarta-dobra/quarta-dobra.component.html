<!-- benefits.component.html -->
<section class="benefits-section py-5" style="background-color: #f8fcfa;">
    <div class="container">

      <div class="row align-items-center justify-content-center">
        <div class="col-lg-12">
          <h1 class="display-5 fw-bold mb-4 text-success text-center">
            O QUE TORNA A CLINIC SMART ÚNICO?
          </h1>
          
        </div>
      </div>
      <div class="row">
        <div class="col-12">
          <div class="benefits-slider">
            <div class="row">
              <ng-container *ngFor="let benefit of paginatedBenefits">
                <div class="col-md-4 mb-4">
                  <div class="benefit-card h-100 bg-white rounded-4 p-4 shadow-sm" style="min-height: 250px!important;">
                    <div class="text-center mb-3">
                      <div class="rounded-circle bg-success d-inline-flex p-3 mb-3">
                        <i class="bi bi-{{benefit.icon}} text-white fs-4"></i>
                      </div>
                      <h4 class="fw-bold h5">{{benefit.title}}</h4>
                    </div>
                    <p class="text-muted mb-0">{{benefit.description}}</p>
                  </div>
                </div>
              </ng-container>
            </div>
            
            <div class="d-flex justify-content-center mt-4">
              <button (click)="prev()" class="btn btn-outline-secondary rounded-circle me-2">
                <i class="bi bi-chevron-left"></i>
              </button>
              <button (click)="next()" class="btn btn-success rounded-circle">
                <i class="bi bi-chevron-right"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
