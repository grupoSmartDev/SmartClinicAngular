<section class="video pad">
  <div class="wrap video-grid">
    <div class="video-copy" lpReveal>
      <h2 class="lp-h2">Veja como funciona o ClinicSmart</h2>
      <p class="lp-lead">
        O ClinicSmart ajuda a sua clínica de em todo processo, em um só lugar.
        Com ele, você consegue fazer a gestão completa dos seus atendimentos e
        otimiza processos, seja uma clínica pequena ou grande.
      </p>
      <a class="lp-btn" (click)="openWhatsApp('Olá, gostaria de solicitar uma demonstração')">
        Solicitar demonstração
        <svg class="ic"><use href="#i-arrow" /></svg>
      </a>
    </div>

    <!-- Player ilustrativo -->
    <div class="player" lpReveal style="--d: .15s" aria-hidden="true">
      <div class="pl-card pc1"><div class="sk g" style="width: 50%"></div><div class="sk"></div><div class="sk" style="width: 75%"></div><div class="sk" style="width: 40%"></div></div>
      <div class="pl-card pc2"><div class="sk g" style="width: 60%"></div><div class="sk"></div><div class="sk" style="width: 70%"></div></div>
      <div class="pl-card pc3"><div class="sk g" style="width: 35%"></div><div class="sk"></div><div class="sk" style="width: 85%"></div></div>
      <div class="pl-card pc4"><div class="sk g"></div><div class="sk" style="width: 60%"></div></div>
      <div class="play">
        <button type="button" tabindex="-1"><svg class="ic"><use href="#i-play" /></svg></button>
      </div>
    </div>
  </div>
</section>
