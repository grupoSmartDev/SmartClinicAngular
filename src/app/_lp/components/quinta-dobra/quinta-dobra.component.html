<!-- testimonials.component.html -->
<section class="testimonials-section py-5 bg-white">
    <div class="container">
      <div class="text-center mb-5">
        <div class="d-flex justify-content-center mb-2">
          <div class="text-warning">
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
            <i class="bi bi-star-fill"></i>
          </div>
        </div>
        <h2 class="display-6 mb-3">
          Ajudamos <span class="text-success">milhares de profissionais</span> a simplificar seus negócios.
        </h2>
        <p class="lead text-muted">
          ClinicSmart é bom? Veja o que estão falando sobre nossa solução!
        </p>
      </div>
      
      <div class="row">
        <ng-container *ngFor="let testimonial of paginatedTestimonials">
          <div class="col-md-4 mb-4">
            <div class="testimonial-card h-100 bg-light rounded-4 p-4">
              <div class="d-flex align-items-center mb-3">
                <div class="avatar me-3">
                  <img [src]="testimonial.photo" class="rounded-circle" width="60" height="60" 
                       alt="{{testimonial.name}}">
                </div>
                <div>
                  <h5 class="fw-bold mb-0">{{testimonial.name}}</h5>
                  <p class="text-muted mb-0">{{testimonial.role}}</p>
                </div>
              </div>
              <div class="testimonial-content">
                <i class="bi bi-quote fs-1 text-success opacity-25"></i>
                <p class="text-muted mb-0">{{testimonial.quote}}</p>
              </div>
            </div>
          </div>
        </ng-container>
      </div>
      
      <div class="d-flex justify-content-center mt-4">
        <button (click)="prev()" class="btn btn-outline-secondary rounded-circle me-2">
          <i class="bi bi-chevron-left"></i>
        </button>
        <button (click)="next()" class="btn btn-success rounded-circle">
          <i class="bi bi-chevron-right"></i>
        </button>
      </div>
    </div>
  </section>
