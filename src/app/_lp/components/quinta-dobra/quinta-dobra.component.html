<!-- Frase de destaque: as palavras acendem conforme a rolagem -->
<section class="statement">
  <div class="wrap">
    <p #frase>
      @for (w of palavras; track $index) {<span class="wd" [class.hl]="$index >= palavras.length - 3">{{ w }}</span>{{ $last ? '' : ' ' }}}
    </p>
  </div>
</section>

<section class="pad depo">
  <div class="wrap">
    <div class="head center" lpReveal>
      <h2 class="lp-h2" style="max-width: 22ch">
        ClinicSmart é bom? Veja o que estão falando sobre nossa solução!
      </h2>
    </div>
    <div class="testi">
      @for (testimonial of testimonials; track testimonial.name; let i = $index) {
      <article class="tcard" lpReveal [style.--d]="i * .1 + 's'">
        <div class="q" aria-hidden="true">“</div>
        <p>{{ testimonial.quote }}</p>
        <div class="who">
          <div class="av">{{ testimonial.name[0] }}</div>
          <h3>{{ testimonial.name }}</h3>
        </div>
      </article>
      }
    </div>
  </div>
</section>
