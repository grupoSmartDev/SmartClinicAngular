<section class="container py-5">
    <div class="row align-items-center justify-content-between">
      <!-- Coluna da Esquerda (Imagem do Laptop e Modal) -->
      <div class="col-md-6 text-center position-relative">
        <img src="https://via.placeholder.com/450x300" alt="Laptop" class="img-fluid">
  
        <!-- Modal de Agendamento -->
        <div class="position-absolute top-50 start-50 translate-middle p-4 bg-white shadow rounded" style="width: 300px;">
          <h5 class="fw-bold mb-3">Novo Agendamento</h5>
          <form>
            <div class="mb-3">
              <label for="cliente" class="form-label">Cliente</label>
              <select id="cliente" class="form-select">
                <option>Ana Costa</option>
                <option>Pedro Souza</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="servico" class="form-label">Serviço</label>
              <input type="text" id="servico" class="form-control" placeholder="Consulta">
            </div>
            <div class="row g-2">
              <div class="col-6">
                <label for="data-agenda" class="form-label">Data</label>
                <input type="date" id="data-agenda" class="form-control">
              </div>
              <div class="col-6">
                <label for="hora" class="form-label">Hora</label>
                <input type="time" id="hora" class="form-control">
              </div>
            </div>
            <div class="d-flex justify-content-between mt-3">
              <button type="button" class="btn btn-secondary">Cancelar</button>
              <button type="submit" class="btn btn-primary">Agendar</button>
            </div>
          </form>
        </div>
  
        <!-- Ícone de Relógio -->
        <!-- <div class="position-absolute" style="top: -20px; right: -20px;">
          <i class="bi bi-calendar-event text-primary" style="font-size: 2rem;"></i>
        </div> -->
      </div>
  
      <!-- Coluna da Direita (Texto e Benefícios) -->
      <div class="col-md-6">
        <h1 class="display-4 fw-bold">Agenda Online</h1>
        <p class="lead">Organize e simplifique seus agendamentos.</p>
        <ul class="list-unstyled">
          <li class="mb-2">
            <i class="bi bi-check-circle-fill text-primary me-2"></i> Agendamento de consultas de forma prática
          </li>
          <li class="mb-2">
            <i class="bi bi-check-circle-fill text-primary me-2"></i> Notificações automáticas de lembretes
          </li>
          <li class="mb-2">
            <i class="bi bi-check-circle-fill text-primary me-2"></i> Controle de disponibilidade e horários
          </li>
          <li class="mb-2">
            <i class="bi bi-check-circle-fill text-primary me-2"></i> Histórico de atendimentos e consultas
          </li>
        </ul>
        <a href="#" class="btn btn-success btn-lg mt-3">
          Conheça a Agenda Inteligente <i class="bi bi-arrow-right ms-2"></i>
        </a>
      </div>
    </div>
  </section>
