<section class="features pad">
  <div class="wrap">
    <div class="feat-head" lpReveal>
      <div class="txt">
        <h2 class="lp-h2">Torne o seu negócio referência para os clientes</h2>
        <p class="lp-lead">
          Ofereça uma experiência moderna e prática usando tecnologia de ponta e
          as melhores ferramentas de gestão para o seu negócio.
        </p>
      </div>
      <a class="lp-btn light" (click)="scrollTo('Assinaturas')">
        Conheça nossos planos
        <svg class="ic"><use href="#i-arrow" /></svg>
      </a>
    </div>

    <div class="bento">
      @for (r of recursos; track r.titulo) {
      <article class="bcard" [class.big]="r.grande" lpReveal lpSpot [style.--d]="r.atraso + 's'">
        <div class="ico"><svg class="ic"><use [attr.href]="'#' + r.icone" /></svg></div>
        <h3>{{ r.titulo }}</h3>
        <p>{{ r.descricao }}</p>
      </article>
      }
    </div>
  </div>
</section>
