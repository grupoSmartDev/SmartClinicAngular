<div class="lp-progress" #progress></div>

<header class="lp-nav" [class.stuck]="stuck">
  <div class="nav-in">
    <a class="logo" (click)="scrollTo('Início')" aria-label="ClinicSmart">
      <img src="assets/image/logo.png" alt="ClinicSmart" />
    </a>
    <nav class="nav-links">
      @for (item of listaItensMenu; track item) {
      <a (click)="scrollTo(item)">{{ item }}</a>
      }
    </nav>
    <div class="nav-cta">
      <a class="lp-btn sm ghost" routerLink="/login">Login</a>
      <a class="lp-btn sm" routerLink="/cadastro">Assinar agora</a>
    </div>
    <button
      type="button"
      class="burger"
      [attr.aria-label]="menuAberto ? 'Fechar menu' : 'Abrir menu'"
      [attr.aria-expanded]="menuAberto"
      (click)="menuAberto = !menuAberto"
    >
      <svg class="ic"><use [attr.href]="menuAberto ? '#i-close' : '#i-menu'" /></svg>
    </button>
  </div>

  <div class="menu" [class.open]="menuAberto">
    @for (item of listaItensMenu; track item) {
    <a (click)="scrollTo(item)">{{ item }}</a>
    }
    <a class="lp-btn ghost" routerLink="/login">Login</a>
    <a class="lp-btn" routerLink="/cadastro">Assinar agora</a>
  </div>
</header>
