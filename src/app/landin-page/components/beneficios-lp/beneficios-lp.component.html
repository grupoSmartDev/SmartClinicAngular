<section class="pad">
  <div class="wrap">
    <div class="head" lpReveal><h2 class="lp-h2">Sua Clinica mais SMART</h2></div>
    <div class="tri">
      @for (b of beneficios; track b.titulo; let i = $index) {
      <article class="lp-card" lpReveal lpSpot [style.--d]="i * .1 + 's'">
        <span class="ghost-num">{{ b.titulo[0] }}</span>
        <div class="ico"><svg class="ic"><use [attr.href]="'#' + b.icone" /></svg></div>
        <h3>{{ b.titulo }}</h3>
        <p>{{ b.descricao }}</p>
      </article>
      }
    </div>
  </div>
</section>
