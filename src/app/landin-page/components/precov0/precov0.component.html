<div class="container my-5">
    <h2 class="text-center mb-5">Planos de Preços</h2>
    <div class="row row-cols-1 row-cols-md-3 g-4">
      <div class="col" *ngFor="let plan of plans">
        <div class="card h-100 border-success">
          <div class="card-header bg-success text-white">
            <h3 class="card-title text-center mb-0">{{ plan.name }}</h3>
          </div>
          <div class="card-body d-flex flex-column">
            <h4 class="card-text text-center mb-4">
              <span class="display-4">R$ {{ plan.price }}</span> /mês
            </h4>
            <ul class="list-group list-group-flush mb-4">
              <li class="list-group-item" *ngFor="let feature of plan.features">
                {{ feature }}
              </li>
            </ul>
            <button class="btn btn-success mt-auto">Escolher Plano</button>
          </div>
        </div>
      </div>
    </div>
  </div>
