<section class="container py-5">
    <div class="row align-items-center">
      <!-- Coluna da Esquerda (Texto e Lista) -->
      <div class="col-md-6">
        <h1 class="display-4 fw-bold">Sistema de cobrança online</h1>
        <p class="lead">Gerencie recebimentos com praticidade.</p>
        <ul class="list-unstyled">
          <li class="mb-2">
            <i class="bi bi-check-circle-fill text-success me-2"></i> Geração de cobranças recorrentes automáticas
          </li>
          <li class="mb-2">
            <i class="bi bi-check-circle-fill text-success me-2"></i> Envio de boletos por e-mail
          </li>
          <li class="mb-2">
            <i class="bi bi-check-circle-fill text-success me-2"></i> Cobrança em cartão, boleto ou pix
          </li>
          <li class="mb-2">
            <i class="bi bi-check-circle-fill text-success me-2"></i> Alertas de vencimento e boletos em atraso
          </li>
        </ul>
        <a href="#" class="btn btn-success btn-lg mt-3">
          Conheça a Cobrança Inteligente <i class="bi bi-arrow-right ms-2"></i>
        </a>
      </div>
  
      <!-- Coluna da Direita (Imagem do Laptop e Modal) -->
      <div class="col-md-6 text-center position-relative">
        <img src="https://via.placeholder.com/450x300" alt="Laptop" class="img-fluid">
  
        <!-- Modal Flutuante -->
        <div class="position-absolute top-50 start-50 translate-middle p-4 bg-white shadow rounded" style="width: 300px;">
          <h5 class="fw-bold mb-3">Adicionar novo boleto</h5>
          <form>
            <div class="mb-3">
              <label for="cobranca" class="form-label">Cobrança</label>
              <select id="cobranca" class="form-select">
                <option>Maria dos Santos</option>
                <option>João Silva</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="descricao" class="form-label">Descrição</label>
              <input type="text" id="descricao" class="form-control" placeholder="Consulta">
            </div>
            <div class="row g-2">
              <div class="col-6">
                <label for="data" class="form-label">Data</label>
                <input type="date" id="data" class="form-control">
              </div>
              <div class="col-6">
                <label for="valor" class="form-label">Valor</label>
                <input type="text" id="valor" class="form-control" placeholder="R$ 290,00">
              </div>
            </div>
            <div class="d-flex justify-content-between mt-3">
              <button type="button" class="btn btn-secondary">Cancelar</button>
              <button type="submit" class="btn btn-success">Gerar Boleto</button>
            </div>
          </form>
        </div>
  
        <!-- Ícone de Dinheiro -->
        <div class="position-absolute" style="top: -20px; right: -20px;">
          <i class="bi bi-cash-stack text-success" style="font-size: 2rem;"></i>
        </div>
      </div>
    </div>
  </section>
