@if (data.length > 0) {
  <div class="table-responsive">
    <table class="table table-striped table-centered mb-0">
      <thead>
        <tr>
          <th *ngFor="let column of columns">{{ column.header }}</th>
          <th class="text-end"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of data">
          <!-- Renderiza dinamicamente as células com base nas colunas -->
          <td *ngFor="let column of columns">{{ item[column.field] }}</td>
          <td class="text-end">
            <a href="javascript:void(0);" (click)="onEdit(item)" class="action-icon">
              <i class="bi bi-pencil text-success"></i>
            </a>
            <a href="javascript:void(0);" (click)="onDelete(item)" class="action-icon">
              <i class="bi bi-trash3 text-danger"></i>
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
} 
@else {
  <div class="alert alert-danger" role="alert">
    Nenhum registro encontrado
  </div>
  <img src="public\image\semRegistro.svg" alt="">
}
