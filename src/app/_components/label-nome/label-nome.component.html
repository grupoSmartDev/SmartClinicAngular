<div class="row align-items-center">
    <div class="col-6 col-md-6">
        <h4 class="page-title">{{nomeTela}}</h4>
    </div>
    @if (exibirBotaoAdicionar) {
      <div class="col-md-6 col-12 text-end d-flex justify-content-end">
        <a
        href="javascript:void(0);"
        (click)="onAdicionarClick()"
        class="btn btn-danger mb-2 me-1"
        ><i class="bi bi-plus"></i></a
      >
      <a href="javascript: void(0);" type="button" class="btn btn-success mb-2 me-1" >
        <i class="bi bi-gear"></i>
      </a>
      <div class="dropdown">
        <button class="btn btn-light mb-2 dropdown-toggle" type="button" id="exportarDropdown" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-file-earmark-arrow-down me-1"></i> Exportar
        </button>
        <ul class="dropdown-menu" aria-labelledby="exportarDropdown">
          <li><a class="dropdown-item" href="javascript:void(0);" (click)="onExportarPDF()"><i class="bi bi-file-earmark-pdf me-1"></i> Exportar PDF</a></li>
          <li><a class="dropdown-item" href="javascript:void(0);" (click)="onExportarExcel()"><i class="bi bi-file-earmark-excel me-1"></i> Exportar CSV (Excel)</a></li>
        </ul>
      </div>

    </div>
    }
  
</div>
